services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kiosco
      POSTGRES_PASSWORD: local_only_change_me
      POSTGRES_DB: kiosco
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["kiosco_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiosco -d kiosco"]
      interval: 3s
      retries: 20
volumes:
  kiosco_pg:
