name: Quality
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kiosco
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: kiosco_test
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U kiosco -d kiosco_test" --health-interval=5s --health-retries=10
    env:
      DATABASE_URL: postgresql://kiosco:test_only@localhost:5432/kiosco_test
      DIRECT_URL: postgresql://kiosco:test_only@localhost:5432/kiosco_test
      SESSION_SECRET: ci-only-long-random-test-secret-never-use-in-production
      APP_URL: http://localhost:3000
      RUN_DB_TESTS: '1'
      E2E_PRODUCTION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
